<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="900" height="500" viewBox="0 0 900 500"
     xmlns="http://www.w3.org/2000/svg"
     font-family="Arial, Helvetica, sans-serif">

  <!-- Background -->
  <rect x="0" y="0" width="900" height="500" fill="#ffffff"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-size="22" font-weight="bold">
    URDF Structure Overview
  </text>

  <!-- ===== Links ===== -->
  <!-- Base Link -->
  <rect x="380" y="70" width="140" height="60" rx="10" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2"/>
  <text x="450" y="95" text-anchor="middle" font-size="14" font-weight="bold">Base Link</text>
  <text x="450" y="115" text-anchor="middle" font-size="11">Visual / Collision</text>

  <!-- Link 1 -->
  <rect x="150" y="220" width="160" height="60" rx="10" fill="#e8f5e9" stroke="#43a047" stroke-width="2"/>
  <text x="230" y="245" text-anchor="middle" font-size="14" font-weight="bold">Link 1</text>
  <text x="230" y="265" text-anchor="middle" font-size="11">Visual / Collision</text>

  <!-- Link 2 -->
  <rect x="590" y="220" width="160" height="60" rx="10" fill="#e8f5e9" stroke="#43a047" stroke-width="2"/>
  <text x="670" y="245" text-anchor="middle" font-size="14" font-weight="bold">Link 2</text>
  <text x="670" y="265" text-anchor="middle" font-size="11">Visual / Collision</text>

  <!-- End Effector -->
  <rect x="590" y="360" width="160" height="60" rx="10" fill="#fff3e0" stroke="#fb8c00" stroke-width="2"/>
  <text x="670" y="385" text-anchor="middle" font-size="14" font-weight="bold">End Effector</text>
  <text x="670" y="405" text-anchor="middle" font-size="11">Tool / Sensor</text>

  <!-- ===== Joints (Lines) ===== -->
  <!-- Base to Link 1 -->
  <line x1="450" y1="130" x2="230" y2="220" stroke="#424242" stroke-width="2"/>
  <text x="320" y="170" font-size="12" fill="#424242">Joint 1 (Revolute)</text>

  <!-- Base to Link 2 -->
  <line x1="450" y1="130" x2="670" y2="220" stroke="#424242" stroke-width="2"/>
  <text x="520" y="170" font-size="12" fill="#424242">Joint 2 (Fixed)</text>

  <!-- Link 2 to End Effector -->
  <line x1="670" y1="280" x2="670" y2="360" stroke="#424242" stroke-width="2"/>
  <text x="680" y="325" font-size="12" fill="#424242">Joint 3 (Prismatic)</text>

  <!-- ===== Legend ===== -->
  <rect x="40" y="340" width="260" height="120" rx="10" fill="#f5f5f5" stroke="#9e9e9e"/>
  <text x="170" y="365" text-anchor="middle" font-size="14" font-weight="bold">Legend</text>

  <rect x="60" y="380" width="20" height="15" fill="#e3f2fd" stroke="#1e88e5"/>
  <text x="90" y="392" font-size="12">Base Link</text>

  <rect x="60" y="405" width="20" height="15" fill="#e8f5e9" stroke="#43a047"/>
  <text x="90" y="417" font-size="12">Robot Link</text>

  <rect x="60" y="430" width="20" height="15" fill="#fff3e0" stroke="#fb8c00"/>
  <text x="90" y="442" font-size="12">End Effector</text>

</svg>
